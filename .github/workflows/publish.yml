name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.9.1). Leave empty to publish the version already in package.json."
        required: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # OIDC trusted publishing: id-token mints a short-lived credential per run,
    # so this repo needs no NPM_TOKEN secret. Mirrors scrtlabs/secretvm-verify.
    # One-time setup on npmjs.com: add a trusted publisher for the secretvm-cli
    # package pointing at repo scrtlabs/secretvm-cli, workflow publish.yml, no
    # environment. Without it the publish step fails authentication.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: `npm@latest` is 12.x now and needs node >= 22, so the
          # upgrade step below fails outright on 20 (EBADENGINE).
          node-version: 24
          # No registry-url on purpose: it writes an .npmrc with a placeholder
          # _authToken, which forces (failing) token auth and blocks the OIDC
          # exchange. npm defaults to registry.npmjs.org and uses OIDC when no
          # credential is present.

      - name: Upgrade npm for OIDC trusted publishing
        # OIDC trusted publishing needs npm >= 11.5.1, and the runner's bundled
        # npm is not guaranteed to be that. Pinned to the 11 line rather than
        # `@latest`, so a new npm major dropping this runner's node breaks
        # nothing here -- which is exactly how the first run of this workflow
        # failed.
        run: npm install -g "npm@^11.5.1"

      # Installs the exact tree in npm-shrinkwrap.json, and its `prepare` script
      # compiles dist/, which is the only thing `files` ships.
      - run: npm ci

      - name: Set version
        # On a release the tag wins. On a manual run the input wins if given;
        # with neither, publish whatever package.json already says.
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -n "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          node -p "'publishing ' + require('./package.json').name + '@' + require('./package.json').version"

      - run: npm run build

      - name: Smoke-test the binary
        # A CLI that cannot start must not reach the registry. This also catches
        # the class of bug that shipped in 0.9.0: `--version` hangs instead of
        # exiting when a dependency leaves a socket open.
        run: timeout 30s node dist/cli.js --version

      # Packed before publishing, and uploaded whatever happens next. Nobody
      # here has an npmjs.com account, so the publish step below can fail on
      # authentication alone -- and when it does, this artifact is still a
      # working build that `npm install -g <tarball>` accepts. Without it a
      # failed run leaves no way to get the fix to anyone.
      - name: Pack the tarball
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          ls -l dist-pack

      - uses: actions/upload-artifact@v4
        with:
          name: secretvm-cli-tarball
          path: dist-pack/*.tgz
          if-no-files-found: error

      - name: Attach the tarball to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-pack/*.tgz --clobber

      - name: Publish to npm (OIDC trusted publishing)
        # setup-node points NPM_CONFIG_USERCONFIG at a temp .npmrc carrying a
        # stale `_auth`. Any credential makes npm skip the OIDC exchange and
        # then fail ENEEDAUTH, so publish against a clean userconfig.
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-clean
        run: |
          printf 'registry=https://registry.npmjs.org/\nprovenance=true\n' > "$NPM_CONFIG_USERCONFIG"
          npm publish --access public
